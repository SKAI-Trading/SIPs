name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run check
        env:
          SIP_PR_TITLE: ${{ github.event.pull_request.title }}
          SIP_PR_NUMBER: ${{ github.event.pull_request.number }}
          SIP_PR_BODY: ${{ github.event.pull_request.body }}
